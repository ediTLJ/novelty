import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

android {
    namespace 'ro.edi.novelty'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId 'ro.edi.novelty'
        minSdkVersion libs.versions.minSdk.get().toInteger() // Android 10
        targetSdkVersion libs.versions.targetSdk.get().toInteger() // Android 15
        versionCode 9
        versionName '2.0-beta'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        compose true
    }

    buildTypes {
        debug {

        }
        release {
            // minifyEnabled true
            // shrinkResources true
            // proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // set Java compatibility to Java 21
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21

        // enable support for the new language APIs
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lint {
        checkDependencies true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/atomicfu.kotlin_module']
        }
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas".toString())
    arg('room.incremental', 'true')
    arg('room.expandProjection', 'true')
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Java 11+ API desugaring
    coreLibraryDesugaring libs.desugar.jdk.libs

    // Kotlin
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.serialization.core

    // AndroidX
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.core.ktx

    // Architecture Components: LiveData, ViewModel...
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.viewmodel.savedstate
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.androidx.hilt.navigation.compose

    // Jetpack Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.runtime.livedata
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    // Navigation 3 (experimental)
    implementation libs.androidx.navigation3.runtime
    implementation libs.androidx.navigation3.ui
    implementation libs.androidx.lifecycle.viewmodel.navigation3

    // Drag-to-reorder lists in Compose
    implementation libs.reorderable

    // Room
    implementation libs.androidx.room.runtime
    ksp libs.androidx.room.compiler
    implementation libs.androidx.room.ktx

    // OkHttp
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor
    implementation libs.okio

    // Retrofit
    implementation libs.retrofit

    // RSS & Atom library
    implementation libs.syndication

    // Timber
    implementation libs.timber
}
