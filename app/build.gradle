apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'dagger.hilt.android.plugin'

android {
    namespace 'ro.edi.novelty'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.edi.novelty'
        minSdkVersion 29 // Android 10
        targetSdkVersion 35 // Android 15
        versionCode 9
        versionName '2.0-beta'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        'room.schemaLocation'  : "$projectDir/schemas".toString(),
                        'room.incremental'     : 'true',
                        'room.expandProjection': 'true']
            }
        }
    }

    buildFeatures {
        buildConfig = true
        dataBinding true
        viewBinding true
        compose true
    }

    buildTypes {
        debug {

        }
        release {
            // minifyEnabled true
            // shrinkResources true
            // proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    compileOptions {
        // set Java compatibility to Java 11
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11

        // enable support for the new language APIs
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lint {
        checkDependencies true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/atomicfu.kotlin_module']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Java 11+ API desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.20'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // AndroidX
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // implementation 'androidx.appcompat:appcompat-resources:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    // implementation 'android.arch.work:work-runtime-ktx:2.0.0'
    // androidTestImplementation 'android.arch.work:work-testing:2.0.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0-alpha01'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Architecture Components: LiveData, ViewModel...
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    // ksp 'androidx.lifecycle:lifecycle-compiler:2.8.7'
    // ksp 'androidx.lifecycle:lifecycle-common-java8:2.8.7'
    // testImplementation 'androidx.arch.core:core-testing:2.2.0'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.52'
    ksp 'com.google.dagger:hilt-compiler:2.52'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.runtime:runtime-livedata'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Navigation 3 (experimental)
    implementation 'androidx.navigation3:navigation3-runtime:1.1.3'
    implementation 'androidx.navigation3:navigation3-ui:1.1.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-navigation3:1.0.0-alpha04'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core:1.7.3'

    // Fragment-in-Compose interop (temporary, until screens are migrated)
    implementation 'androidx.fragment:fragment-compose:1.8.5'

    // Drag-to-reorder lists in Compose
    implementation 'sh.calvin.reorderable:reorderable:2.4.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    // testImplementation 'androidx.room:room-testing:2.6.1'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.1'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'

    // RSS & Atom library
    implementation 'com.ouattararomuald:syndication:2.1.1'

    // Coil
    // implementation 'io.coil-kt:coil:2.7.0'

    // Timber
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // testing dependencies
    // androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    // androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    // androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    // androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    // testImplementation 'junit:junit:4.13.2'
}
